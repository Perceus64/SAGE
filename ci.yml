name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -v

      - name: Smoke test CLI end-to-end
        run: |
          mkdir -p /tmp/demo_docs
          echo "Photosynthesis converts light into chemical energy." > /tmp/demo_docs/notes.txt
          sage sync /tmp/demo_docs --db /tmp/demo.db
          sage ask --db /tmp/demo.db "what does photosynthesis convert"
          sage stats --db /tmp/demo.db
