[project]
name = "sage-study"
version = "0.1.0"
description = "Offline-first AI study assistant — index course material once, ask questions with zero internet or cloud API calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "watchdog>=3.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2"]

[project.scripts]
sage = "sage.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sage"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

